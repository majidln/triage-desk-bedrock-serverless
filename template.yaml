AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Triage Desk - AI-Powered Customer Support Pipeline
Parameters:
  StageName:
    Type: String
    Default: Dev
  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  AlertEmail:
    Type: String
    Default: ''
    Description: Email address for pipeline alarms. AWS sends a confirmation email first; nothing arrives until it's confirmed.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    CodeUri: lambdas/
    LoggingConfig:
      LogFormat: JSON

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      Name: !Sub '${AWS::StackName}-HttpApi'

  SupportRequestReceiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ReceiverFunction'
      Handler: handlers/support-request-receiver.handler
      Architectures:
      - x86_64
      Events:
        ReceiveSupportRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /support-request
            Method: post
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref SupportTicketTable
      Environment:
        Variables:
          SUPPORT_TICKETS_TABLE: !Ref SupportTicketTable
          POWERTOOLS_SERVICE_NAME: triage-receiver
          POWERTOOLS_LOG_LEVEL: INFO
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - handlers/support-request-receiver.ts
        Minify: true
        Target: es2020
        Sourcemap: true
        Bundle: true

  FetchSupportRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-FetchFunction'
      Handler: handlers/fetch-support-ticket.handler
      Architectures:
      - x86_64
      Events:
        FetchSupportRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /support-request
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SupportTicketTable
      Environment:
        Variables:
          SUPPORT_TICKETS_TABLE: !Ref SupportTicketTable
          POWERTOOLS_SERVICE_NAME: triage-fetch
          POWERTOOLS_LOG_LEVEL: INFO
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - handlers/fetch-support-ticket.ts
        Minify: true
        Target: es2020
        Sourcemap: true
        Bundle: true

  SupportRequestProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ProcessorFunction'
      Handler: handlers/support-request-processor.handler
      # A batch of 5 takes ~15 s; 60 s leaves room for slow model calls (see PLANNING.md §3)
      Timeout: 60
      Architectures:
      - x86_64
      Events:
        ProcessQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt SupportRequestQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # At most 5 processors at once, sized to Bedrock's 100 requests a minute. Extra tickets wait in the queue.
            # Not reserved concurrency: Lambda would throttle the batches the poller still takes, and they would use up receives.
            ScalingConfig:
              MaximumConcurrency: 5
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SupportTicketTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SupportTicketNotificationTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:*::foundation-model/${ModelId}'
      LoggingConfig:
        LogGroup: !Ref ProcessorLogGroup
      Environment:
        Variables:
          SUPPORT_TICKETS_TABLE: !Ref SupportTicketTable
          BEDROCK_MODEL_ID: !Ref ModelId
          SNS_TOPIC_ARN: !GetAtt SupportTicketNotificationTopic.TopicArn
          POWERTOOLS_SERVICE_NAME: triage-processor
          POWERTOOLS_LOG_LEVEL: INFO
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - handlers/support-request-processor.ts
        Minify: true
        Target: es2020
        Sourcemap: true
        Bundle: true

  SupportTicketTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${AWS::StackName}-Table'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      # Every change to a ticket, kept for 24 h. The intake pipe reads new tickets from it.
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  SupportRequestQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${AWS::StackName}-RequestQueue'
      # At least 6 x the processor's 60 s timeout, so SQS never lends a message to a second
      # invocation while the first may still be working on it
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600  # 14 days in seconds
      ReceiveMessageWaitTimeSeconds: 20  # Long polling
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SupportRequestDLQ.Arn
        # ~30 min of retries (5 x 6 min) rides out a short Bedrock outage before the DLQ
        maxReceiveCount: 5

  SupportRequestDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${AWS::StackName}-RequestDLQ'
      MessageRetentionPeriod: 1209600  # 14 days

  # Moves each new ticket from the table's stream to the queue. The receiver only writes
  # the ticket: one write, so a ticket can't be stored without also reaching the queue.
  TicketIntakePipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub '${AWS::StackName}-ticket-intake'
      RoleArn: !GetAtt TicketIntakePipeRole.Arn
      Source: !GetAtt SupportTicketTable.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          # Not LATEST: a new pipe takes minutes to start polling and would miss tickets
          StartingPosition: TRIM_HORIZON
          BatchSize: 10
          MaximumRetryAttempts: 10
          DeadLetterConfig:
            Arn: !GetAtt TicketIntakeDLQ.Arn
        # Only new tickets. The processor's own updates (MODIFY) must not queue the ticket again.
        FilterCriteria:
          Filters:
            - Pattern: '{"eventName": ["INSERT"]}'
      # Each stream record becomes one SQS message
      Target: !GetAtt SupportRequestQueue.Arn

  TicketIntakePipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: ticket-intake
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !GetAtt SupportTicketTable.StreamArn
              - Effect: Allow
                Action:
                  - dynamodb:ListStreams
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt SupportRequestQueue.Arn
                  - !GetAtt TicketIntakeDLQ.Arn

  # Batches the pipe gave up on. The tickets themselves stay in the table as RECEIVED.
  TicketIntakeDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${AWS::StackName}-IntakeDLQ'
      MessageRetentionPeriod: 1209600  # 14 days

  SupportTicketNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-TicketNotifications'
      Tags:
      - Key: Purpose
        Value: SupportTicketNotifications
      - Key: SubscriptionType
        Value: SelfService

  # The processor's own log group, managed here so it has a retention and the metric
  # filter below has something to attach to on the first deploy.
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${AWS::StackName}/processor'
      RetentionInDays: 30

  # Counts the processor's ERROR lines (TicketFailed, PoisonedMessage): each one is a
  # ticket that needs a person. Transient errors are WARN and end in the DLQ instead.
  ProcessorErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ProcessorLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricName: ProcessorErrors
          MetricNamespace: TriageDesk
          MetricValue: 1

  # Alarms watch symptoms a customer or the support team would notice. Each one emails the
  # alert topic when it fires and again when it's back to OK. No data (no traffic) is OK.

  # A ticket needs a person: marked FAILED, or a message that couldn't be read
  ProcessorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ProcessorErrors'
      AlarmDescription: 'A ticket was marked FAILED or a message was dropped: someone has to look'
      MetricName: ProcessorErrors
      Namespace: TriageDesk
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # The processor itself crashed or timed out. Per-ticket failures don't count here: the
  # handler catches them and returns, so Lambda sees a success. This catches what our own
  # log lines can't, like a missing environment variable at cold start.
  ProcessorCrashAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ProcessorCrashes'
      AlarmDescription: 'The processor crashed or timed out'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SupportRequestProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # A ticket was rejected at the door (the Step 0 finding: a throttled receiver is a 503).
  # Client mistakes are 4xx, so any 5xx is our fault.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-Api5xx'
      AlarmDescription: 'The API returned a 5xx: a customer could not submit or fetch a ticket'
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: !Ref StageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # A ticket gave up after all its retries (maxReceiveCount)
  RequestDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-RequestDLQ'
      AlarmDescription: 'A ticket failed every retry and is in the request DLQ: fix the cause, then redrive it'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SupportRequestDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # The intake pipe couldn't put a ticket on the queue; the ticket is stuck as RECEIVED
  IntakeDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-IntakeDLQ'
      AlarmDescription: 'The intake pipe gave up on new tickets: they are stuck in the table as RECEIVED'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TicketIntakeDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # Tickets are waiting and nobody is working on them, e.g. a deploy broke the processor's
  # access to the queue: no invocations, so no errors and no DLQ messages either.
  # Retries hide a ticket for 6 min at a time, so 20 min is longer than retries explain.
  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-QueueBacklog'
      AlarmDescription: 'The oldest ticket in the queue has waited over 20 minutes: is the processor running?'
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SupportRequestQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-Alerts'

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

Outputs:
  HttpApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/'
  HttpApiId:
    Description: Api id of HttpApi
    Value:
      Ref: HttpApi

  SupportRequestReceiverFunction:
    Description: Lambda Function ARN for Support Request Receiver
    Value: !GetAtt SupportRequestReceiverFunction.Arn

  SupportRequestProcessorFunction:
    Description: Lambda Function ARN for Support Request Processor
    Value: !GetAtt SupportRequestProcessorFunction.Arn

  SupportRequestQueue:
    Description: Support Request Queue ARN
    Value: !GetAtt SupportRequestQueue.Arn

  SupportTicketNotificationTopicArn:
    Description: SNS Topic ARN for Support Ticket Notifications - Share this with admins to subscribe
    Value: !Ref SupportTicketNotificationTopic
    Export:
      Name: !Sub '${AWS::StackName}-TicketNotificationTopicArn'

  AlertTopicArn:
    Description: SNS Topic ARN for pipeline alarms - Share this with technical admins to subscribe
    Value: !Ref AlertTopic

  SubscriptionInstructions:
    Description: Instructions for subscribing to notifications
    Value: "Use the SNS Topic ARNs above to subscribe via AWS Console, CLI, or SDK. See deployment guide for details."
